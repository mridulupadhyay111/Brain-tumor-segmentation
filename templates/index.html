<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Brain Tumor Segmentation & Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }
        form {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
        }
        input, button {
            display: block;
            margin-top: 10px;
            padding: 8px;
            width: 100%;
        }
        img {
            margin-top: 20px;
            max-width: 100%;
            border: 2px solid #ddd;
            border-radius: 5px;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #e9f7ef;
            border-left: 4px solid #28a745;
        }
        .error {
            margin-top: 20px;
            padding: 15px;
            background: #f8d7da;
            border-left: 4px solid #dc3545;
        }
        pre {
        white-space: pre-wrap;
        word-wrap: break-word;
        }
    </style>
</head>
<body>
<h1>Brain Tumor Segmentation & AI Report</h1>


<form id="uploadForm">
      <input type="text" id="patientName" placeholder="Patient Name" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="date" id="date" required />
      <input type="file" id="file" accept="image/*" required />
      <button type="submit">Analyze</button>
    </form>

<div id="output"></div>

<script>

document.getElementById("uploadForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const formData = new FormData();
      formData.append("patient_name", document.getElementById("patientName").value);
      formData.append("email", document.getElementById("email").value);
      formData.append("date", document.getElementById("date").value);
      formData.append("file", document.getElementById("file").files[0]);

      const outputDiv = document.getElementById('output');
      outputDiv.innerHTML = "<p>Processing... Please wait.</p>"

try {
        const response = await fetch('http://127.0.0.1:8000/analyze/', {
            method: 'POST',
            body: formData
        });

        if (!response.ok) {
            throw new Error("Server error: " + response.statusText);
        }

        const result = await response.json();
        outputDiv.innerHTML = `
            <div class="result">
                <h3>Analysis Complete ✅</h3>
                <p><strong>Tumor Volume:</strong> ${result.tumor_volume}</p>
                <p><strong>Report:</strong></p>
                <pre>${result.report}</pre>
                <div style="display: flex; gap: 20px;">
                <img src="/static/uploads/original.png" width="400px">
                <img src="/static/uploads/segmented.png" width="400px">
                </div>
                <p><em>A detailed report has been sent to your email.</em></p>
            </div>
        `;
    } catch (error) {
        outputDiv.innerHTML = `
            <div class="error">
                <strong>Error:</strong> ${error.message}
            </div>
        `;
    }
}); 

</script>

</body>
</html>
